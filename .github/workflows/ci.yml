name: Linux validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb libxtst6 imagemagick
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
      - run: go test -race ./... && go vet ./...
      - name: Go dependency check
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Development IPC origin checks
        run: xvfb-run -a -s "-screen 0 1280x900x24" python3 scripts/dev-origin-smoke.py
      - name: Package Linux application
        run: |
          wails build -tags webkit2_41 -s -m -nosyncgomod
      - name: Native smoke
        run: xvfb-run -a -s "-screen 0 1280x900x24" python3 scripts/native-smoke.py build/bin/termxp
      - uses: actions/upload-artifact@v4
        with:
          name: termxp-linux-amd64
          path: build/bin/termxp
